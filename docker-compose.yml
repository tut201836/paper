version: "3"
services:
  ubuntu-texlive-ja:
    image: fuchami/alpine-latex
    # image: paperist/alpine-texlive-ja
    #build: .
    command: ["sh", "-lc", "tail -f /dev/null"]
    volumes:
      - ../:/workdir
      - ~/.gitconfig:/root/.gitconfig
      - ./.latexmkrc:/root/.latexmkrc
    environment:
      SHELL: "/bin/sh"